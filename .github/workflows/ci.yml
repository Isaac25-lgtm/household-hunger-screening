name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Runs the method tests on synthetic fixtures and regression checks on the committed public
    # aggregates. No source microdata are downloaded or used; tests that need them are skipped.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -e . --no-deps
      - name: Lint
        run: ruff check src tests scripts dashboard
      - name: Release-safety audit
        run: python scripts/check_release_safety.py
      - name: Tests
        run: pytest -v -p no:cacheprovider
